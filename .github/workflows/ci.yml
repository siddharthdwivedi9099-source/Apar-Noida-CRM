# CI pipeline (Phase 30 deployment and DevOps readiness).
# Runs install, typecheck, build, offline tests, deployment artifact validation,
# and API/web image build checks on every push/PR.
name: CI

on:
  push:
    branches: ["main", "codex-*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (offline suites)
        run: npm test

      - name: Validate deployment artifacts
        run: node tests/phase30-deployment-devops-exhaustive.mjs

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API and web images
        run: docker compose build api web

  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/apar-elite-crm-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/apar-elite-crm-api:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_DEFAULT_TENANT_SLUG=sample-tenant

      - name: Publish web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/apar-elite-crm-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/apar-elite-crm-web:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_DEFAULT_TENANT_SLUG=sample-tenant
