server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline security headers for the SPA (CSP/HSTS stay with the API and the
  # TLS-terminating ingress, since the API origin is a deploy-time setting).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location block suppresses server-level headers, so the
    # security set is repeated here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # Single-page app: route all unknown paths to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
